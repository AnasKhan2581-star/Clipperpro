name: E2E

# Real-world checks that unit tests can't do: Whisper captions on real speech,
# real URL downloads, and the Twitch download path.
on:
  push:
    branches: [main]
    paths: ["clipper/**", "requirements.txt", "tests/e2e/**", ".github/**", "config/settings.yaml"]
  workflow_dispatch:
    inputs:
      twitch_url:
        description: Optional Twitch VOD URL for the Twitch smoke test
        required: false

permissions:
  contents: read

jobs:
  captions:
    name: AI captions on real speech
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          whisper-model: tiny
      - run: sudo apt-get install -y -qq espeak-ng > /dev/null
      - name: Build a fake 2-minute stream with a loud spoken hype moment at 1:00
        run: |
          mkdir -p e2e
          espeak-ng -s 140 -a 200 -w e2e/speech.wav "No way bro! The cops are chasing us. Five stars! Run, run! Let's go, clip that!"
          ffmpeg -v error -y -f lavfi -i testsrc2=size=1280x720:rate=30:duration=120 \
            -f lavfi -i "anoisesrc=d=120:c=pink:a=0.015" -i e2e/speech.wav \
            -filter_complex "[2:a]adelay=60000|60000,volume=3[s];[1:a][s]amix=inputs=2:normalize=0:duration=first[a]" \
            -map 0:v -map "[a]" -c:v libx264 -preset ultrafast -c:a aac e2e/vod.mp4
      - run: python -m clipper run e2e/vod.mp4 --out out/captions --clips 1 --streamer Tester --whisper-model tiny --language en --min-seconds 15 --max-seconds 30
      - run: python tests/e2e/check.py out/captions captions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-captions
          path: out/captions/clips/
          retention-days: 7

  download:
    name: Real URL download (open-license video)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          whisper-model: tiny
      - name: Allowlist off for this public test video
        run: |
          mkdir -p "$RUNNER_TEMP/cfg" && cp config/*.yaml "$RUNNER_TEMP/cfg/"
          sed -i 's/^enforce: true/enforce: false/' "$RUNNER_TEMP/cfg/streamers.yaml"
          echo "CLIPPER_CONFIG_DIR=$RUNNER_TEMP/cfg" >> "$GITHUB_ENV"
      # Big Buck Bunny (c) Blender Foundation, CC-BY 3.0
      - run: python -m clipper run "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4" --out out/download --clips 2 --streamer "Blender Foundation" --whisper-model tiny --min-seconds 15 --max-seconds 25
      - run: python tests/e2e/check.py out/download download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-download
          path: out/download/clips/
          retention-days: 7

  twitch:
    name: Twitch download path (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # depends on a live third-party site
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - env:
          TWITCH_URL: ${{ inputs.twitch_url }}
        run: python tests/e2e/twitch_smoke.py $TWITCH_URL
