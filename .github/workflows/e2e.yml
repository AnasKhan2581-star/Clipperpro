name: E2E

# Real-world checks that unit tests can't do: Whisper captions on real speech,
# URL downloads (section + full fallback), and the Twitch download path.
on:
  push:
    branches: [main]
    paths: ["clipper/**", "requirements.txt", "tests/e2e/**", ".github/**", "config/settings.yaml"]
  workflow_dispatch:
    inputs:
      twitch_url:
        description: Optional Twitch VOD URL for the Twitch smoke test
        required: false

permissions:
  contents: read

jobs:
  captions:
    name: AI captions on real speech
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          whisper-model: tiny
      - run: .github/actions/setup/apt.sh espeak-ng
        timeout-minutes: 15
      - run: mkdir -p e2e && tests/e2e/make_vod.sh e2e/vod.mp4
      - run: python -m clipper run e2e/vod.mp4 --out out/captions --clips 1 --streamer Tester --whisper-model tiny --language en --min-seconds 15 --max-seconds 30
      - run: python tests/e2e/check.py out/captions captions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-captions
          path: out/captions/clips/
          retention-days: 7

  download:
    name: URL download (sections + fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          whisper-model: tiny
      - run: .github/actions/setup/apt.sh espeak-ng
        timeout-minutes: 15
      - name: Serve a test video over HTTP (with and without Range support)
        run: |
          mkdir -p e2e && tests/e2e/make_vod.sh e2e/vod.mp4
          nohup python tests/e2e/serve.py e2e 8812 > /dev/null 2>&1 &
          (cd e2e && nohup python -m http.server 8811 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 2
          curl -fsS -r 0-99 -o /dev/null -w "range server: %{http_code}\n" http://127.0.0.1:8812/vod.mp4
          mkdir -p "$RUNNER_TEMP/cfg" && cp config/*.yaml "$RUNNER_TEMP/cfg/"
          sed -i 's/^enforce: true/enforce: false/' "$RUNNER_TEMP/cfg/streamers.yaml"
          echo "CLIPPER_CONFIG_DIR=$RUNNER_TEMP/cfg" >> "$GITHUB_ENV"
      - name: Section downloads + captions
        run: python -m clipper run http://127.0.0.1:8812/vod.mp4 --out out/sections --clips 1 --streamer Tester --whisper-model tiny --language en --min-seconds 15 --max-seconds 30
      - run: python tests/e2e/check.py out/sections download && python tests/e2e/check.py out/sections captions
      - name: Host without seeking -> full-download fallback
        run: python -m clipper run http://127.0.0.1:8811/vod.mp4 --out out/fallback --clips 2 --streamer Tester --no-captions --min-seconds 15 --max-seconds 25
      - run: python tests/e2e/check.py out/fallback download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-download
          path: out/sections/clips/
          retention-days: 7

  twitch:
    name: Twitch download path (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # depends on a live third-party site
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        timeout-minutes: 15
      - env:
          TWITCH_URL: ${{ inputs.twitch_url }}
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/e2e/twitch_smoke.py $TWITCH_URL
