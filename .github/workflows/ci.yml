name: CI

on:
  push:
    paths-ignore: ["state/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Docker build
        run: docker build -t gta6-clip-pipeline .
