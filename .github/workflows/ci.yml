name: CI

on:
  push:
    paths-ignore: ["state/**", "**.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: .github/actions/setup/apt.sh ffmpeg
        timeout-minutes: 15
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Docker build
        run: docker build -t gta6-clip-pipeline .
