name: Setup clip pipeline
description: Python, ffmpeg, caption font, dependencies and Whisper model cache
inputs:
  whisper-model:
    description: Whisper model to cache
    default: base
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Install ffmpeg + fonts
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
        mkdir -p ~/.fonts
        curl -fsSL --max-time 30 --retry 2 -o ~/.fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf || true
        fc-cache -f > /dev/null
    - name: Install Python dependencies
      shell: bash
      run: pip install -q -r requirements.txt
    - name: Cache Whisper model
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: whisper-${{ inputs.whisper-model }}-v1
